<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardDown Icon Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f3ea;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 716.8px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      :root {
        --p2m-duration: 1200ms;
        --p2m-ease-enter: cubic-bezier(0, 0, 0.2, 1);
        --p2m-ease-settle: cubic-bezier(0.4, 0, 0.2, 1);
        --p2m-ease-narrative: cubic-bezier(0.34, 0, 0.14, 1);
        --p2m-shadow: drop-shadow(0 26px 28px rgba(74, 56, 40, 0.18));
      }

      #logo-root svg {
        overflow: visible;
      }

      #app-tile,
      #card-stack,
      #document-card,
      #markdown-lines,
      #mark-c,
      #down-arrow,
      #fold-accent {
        transform-box: fill-box;
        transform-origin: center;
      }

      #app-tile {
        opacity: 0;
        transform: scale(0.92);
        animation: cd-tile var(--p2m-duration) cubic-bezier(0.34, 0, 0.14, 1) both;
      }

      #card-stack {
        opacity: 0;
        transform: translateY(42px) scale(0.96) rotate(-2deg);
        animation: cd-stack var(--p2m-duration) cubic-bezier(0, 0, 0.2, 1) both;
      }

      #document-card,
      #fold-accent {
        opacity: 0;
        transform: translateY(28px) scale(0.98);
        animation: cd-front var(--p2m-duration) cubic-bezier(0, 0, 0.2, 1) both;
      }

      #markdown-lines {
        opacity: 0;
        transform: translateY(18px);
        animation: cd-lines var(--p2m-duration) cubic-bezier(0, 0, 0.2, 1) both;
      }

      #mark-c {
        stroke-dasharray: 1.08;
        stroke-dashoffset: 1.08;
        animation: cd-draw-c var(--p2m-duration) cubic-bezier(0.34, 0, 0.14, 1) both;
      }

      #down-arrow {
        opacity: 0;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        transform: translateY(-16px) scale(0.94);
        animation: cd-arrow var(--p2m-duration) cubic-bezier(0, 0, 0.2, 1) both;
      }

      @keyframes cd-tile {
        0% { opacity: 0; transform: scale(0.92); }
        18% { opacity: 1; transform: scale(0.9); animation-timing-function: cubic-bezier(0.34, 0, 0.14, 1); }
        68% { opacity: 1; transform: scale(1.012); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes cd-stack {
        0%, 14% { opacity: 0; transform: translateY(42px) scale(0.96) rotate(-2deg); }
        58% { opacity: 1; transform: translateY(-8px) scale(1.01) rotate(0.6deg); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      }

      @keyframes cd-front {
        0%, 22% { opacity: 0; transform: translateY(28px) scale(0.98); }
        64% { opacity: 1; transform: translateY(-5px) scale(1.006); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes cd-lines {
        0%, 38% { opacity: 0; transform: translateY(18px); }
        72% { opacity: 0.82; transform: translateY(-2px); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        100% { opacity: 0.82; transform: translateY(0); }
      }

      @keyframes cd-draw-c {
        0%, 28% { stroke-dashoffset: 1.08; opacity: 0; }
        36% { opacity: 1; }
        78% { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      @keyframes cd-arrow {
        0%, 46% { opacity: 0; stroke-dashoffset: 1; transform: translateY(-16px) scale(0.94); }
        72% { opacity: 1; stroke-dashoffset: 0; transform: translateY(5px) scale(1.012); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        100% { opacity: 1; stroke-dashoffset: 0; transform: translateY(0) scale(1); }
      }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="1200"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Hover</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Pulse</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Arc</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">Squash &amp; stretch</span>
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LOGO = {"tag":"svg","attrs":{"viewBox":"0 0 1024 1024","role":"img","aria-labelledby":"title desc"},"children":[{"tag":"title","attrs":{"id":"title"},"children":[],"text":"CardDown project icon"},{"tag":"desc","attrs":{"id":"desc"},"children":[],"text":"A minimal CardDown app icon with stacked cards and a Markdown-inspired M down mark."},{"tag":"defs","attrs":{},"children":[{"tag":"linearGradient","attrs":{"id":"tile-gradient","x1":"154","y1":"122","x2":"872","y2":"900","gradientUnits":"userSpaceOnUse"},"children":[{"tag":"stop","attrs":{"offset":"0","stop-color":"#fffaf2"},"children":[]},{"tag":"stop","attrs":{"offset":"1","stop-color":"#edf5f2"},"children":[]}]},{"tag":"linearGradient","attrs":{"id":"front-card-gradient","x1":"310","y1":"210","x2":"716","y2":"816","gradientUnits":"userSpaceOnUse"},"children":[{"tag":"stop","attrs":{"offset":"0","stop-color":"#ffffff"},"children":[]},{"tag":"stop","attrs":{"offset":"1","stop-color":"#fbf4ea"},"children":[]}]},{"tag":"filter","attrs":{"id":"card-shadow","x":"-18%","y":"-18%","width":"136%","height":"136%","color-interpolation-filters":"sRGB"},"children":[{"tag":"feDropShadow","attrs":{"dx":"0","dy":"22","stdDeviation":"28","flood-color":"#31423d","flood-opacity":"0.12"},"children":[]}]}]},{"tag":"g","attrs":{"id":"app-tile"},"children":[{"tag":"rect","attrs":{"x":"112","y":"112","width":"800","height":"800","rx":"224","fill":"url(#tile-gradient)"},"children":[]}]},{"tag":"g","attrs":{"id":"card-stack","filter":"url(#card-shadow)"},"children":[{"tag":"rect","attrs":{"id":"back-card","x":"344","y":"244","width":"376","height":"532","rx":"98","fill":"#dcebe6","transform":"rotate(5 532 510)"},"children":[]},{"tag":"rect","attrs":{"id":"middle-card","x":"304","y":"226","width":"416","height":"570","rx":"108","fill":"#efe0cf","transform":"rotate(-4 512 511)"},"children":[]},{"tag":"rect","attrs":{"id":"document-card","x":"270","y":"200","width":"484","height":"624","rx":"118","fill":"url(#front-card-gradient)"},"children":[]}]},{"tag":"g","attrs":{"id":"fold-accent","opacity":"0"},"children":[]},{"tag":"g","attrs":{"id":"markdown-lines","opacity":"0"},"children":[]},{"tag":"g","attrs":{"id":"carddown-mark","fill":"none","stroke-linecap":"round","stroke-linejoin":"round"},"children":[{"tag":"path","attrs":{"id":"mark-c","pathLength":"1","d":"M358 588V376L458 502L558 376V588","stroke":"#2d6f68","stroke-width":"78"},"children":[]},{"tag":"path","attrs":{"id":"down-arrow","pathLength":"1","d":"M668 376v210M590 506l78 82 78-82","stroke":"#d56f49","stroke-width":"78"},"children":[]}]}]};
    const SVG_TEXT = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1024 1024\" role=\"img\" aria-labelledby=\"title desc\"><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n  <title id=\"title\">CardDown project icon<\/title>\n  <desc id=\"desc\">A minimal CardDown app icon with stacked cards and a Markdown-inspired M down mark.<\/desc>\n  <defs>\n    <linearGradient id=\"tile-gradient\" x1=\"154\" y1=\"122\" x2=\"872\" y2=\"900\" gradientUnits=\"userSpaceOnUse\">\n      <stop offset=\"0\" stop-color=\"#fffaf2\"/>\n      <stop offset=\"1\" stop-color=\"#edf5f2\"/>\n    <\/linearGradient>\n    <linearGradient id=\"front-card-gradient\" x1=\"310\" y1=\"210\" x2=\"716\" y2=\"816\" gradientUnits=\"userSpaceOnUse\">\n      <stop offset=\"0\" stop-color=\"#ffffff\"/>\n      <stop offset=\"1\" stop-color=\"#fbf4ea\"/>\n    <\/linearGradient>\n    <filter id=\"card-shadow\" x=\"-18%\" y=\"-18%\" width=\"136%\" height=\"136%\" color-interpolation-filters=\"sRGB\">\n      <feDropShadow dx=\"0\" dy=\"22\" stdDeviation=\"28\" flood-color=\"#31423d\" flood-opacity=\"0.12\"/>\n    <\/filter>\n  <\/defs>\n\n  <g id=\"app-tile\">\n    <rect x=\"112\" y=\"112\" width=\"800\" height=\"800\" rx=\"224\" fill=\"url(#tile-gradient)\"/>\n  <\/g>\n\n  <g id=\"card-stack\" filter=\"url(#card-shadow)\">\n    <rect id=\"back-card\" x=\"344\" y=\"244\" width=\"376\" height=\"532\" rx=\"98\" fill=\"#dcebe6\" transform=\"rotate(5 532 510)\"/>\n    <rect id=\"middle-card\" x=\"304\" y=\"226\" width=\"416\" height=\"570\" rx=\"108\" fill=\"#efe0cf\" transform=\"rotate(-4 512 511)\"/>\n    <rect id=\"document-card\" x=\"270\" y=\"200\" width=\"484\" height=\"624\" rx=\"118\" fill=\"url(#front-card-gradient)\"/>\n  <\/g>\n\n  <g id=\"fold-accent\" opacity=\"0\"/>\n  <g id=\"markdown-lines\" opacity=\"0\"/>\n\n  <g id=\"carddown-mark\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path id=\"mark-c\" pathLength=\"1\" d=\"M358 588V376L458 502L558 376V588\" stroke=\"#2d6f68\" stroke-width=\"78\"/>\n    <path id=\"down-arrow\" pathLength=\"1\" d=\"M668 376v210M590 506l78 82 78-82\" stroke=\"#d56f49\" stroke-width=\"78\"/>\n  <\/g>\n<\/svg>\n";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 1200;

    let playbackRate = 0.45;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "squashstretch"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomImages() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const img = new Image();
        img.src = SVG_URI;
        img.alt = "";
        stage.appendChild(img);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] img');
      const pulse = document.querySelector('[data-atom="pulse"] img');
      const arc = document.querySelector('[data-atom="arc"] img');
      const press = document.querySelector('[data-atom="press"] img');

      hover.parentElement.addEventListener("mouseenter", () => {
        flashPills("squashstretch", "appeal");
        hover.style.transform = "scale(1.08) rotate(-1.5deg)";
      });
      hover.parentElement.addEventListener("mouseleave", () => {
        hover.style.transform = "scale(1)";
      });

      function pulseTick(ts) {
        const p = (Math.sin(ts / 900) + 1) / 2;
        pulse.style.transform = `scale(${1 + 0.1 * p})`;
        pulseRaf = requestAnimationFrame(pulseTick);
      }
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulseRaf = requestAnimationFrame(pulseTick);
      }

      let arcAngle = -14;
      let arcVel = 0;
      function arcTick() {
        arcVel += (0 - arcAngle) * 0.08;
        arcVel *= 0.86;
        arcAngle += arcVel;
        arc.style.transform = `rotate(${arcAngle}deg)`;
        arcRaf = requestAnimationFrame(arcTick);
      }
      arc.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "appeal");
        cancelAnimationFrame(arcRaf);
        arcAngle = 28;
        arcVel = 0;
        arcTick();
      });
      arc.parentElement.addEventListener("mouseleave", () => {
        arcAngle = 0;
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("squashstretch", "anticipation");
        press.style.transform = "scaleX(1.10) scaleY(0.88)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 0.45 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(0.45, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>
